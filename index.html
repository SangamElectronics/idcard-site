<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee QR Code Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<style>
  :root{
    --navy:#0f1a26;
    --navy-2:#1c2b3d;
    --red:#e02430;
    --red-dark:#a8161f;
    --gold:#f2b705;
    --paper:#eef1f6;
    --muted:#8792a1;
    --line:#e7eaf0;
    --ink:#141b26;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  .logo-bar{
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:12px 20px;
    border-bottom:1px solid var(--line);
  }
  .logo-bar img{ height:34px; width:auto; object-fit:contain; }
  .logo-bar .divider{ width:1px; height:26px; background:#dde1e7; }

  header{
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(120% 160% at 15% 0%, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 40%),
      linear-gradient(125deg, var(--navy) 0%, var(--navy-2) 60%, #0a121c 100%);
    color:#fff;
    padding:26px 24px;
    border-top:4px solid var(--red);
  }
  header::after{
    content:"";
    position:absolute;
    right:-30px; top:-40px;
    width:150px; height:150px;
    border-radius:50%;
    background:rgba(224,36,48,0.18);
  }
  header h1{
    margin:0 0 4px;
    font-family:'Poppins',sans-serif;
    font-size:1.35rem;
    font-weight:700;
    position:relative;
    z-index:1;
  }
  header p{
    margin:0;
    opacity:0.75;
    font-size:0.9rem;
    position:relative;
    z-index:1;
  }

  .toolbar{
    padding:14px 24px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
    background:#fff;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    z-index:5;
  }
  .toolbar input{
    padding:10px 14px;
    border:1px solid #d7dce3;
    border-radius:10px;
    font-size:0.9rem;
    min-width:220px;
    font-family:'Inter',sans-serif;
    outline:none;
    transition:border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .toolbar input:focus{
    border-color:var(--red);
    box-shadow:0 0 0 3px rgba(224,36,48,0.12);
  }
  .toolbar button{
    padding:10px 18px;
    border:none;
    border-radius:10px;
    background:linear-gradient(120deg, var(--red) 0%, var(--red-dark) 100%);
    color:#fff;
    font-weight:600;
    cursor:pointer;
    font-size:0.9rem;
    font-family:'Inter',sans-serif;
    box-shadow:0 6px 16px rgba(224,36,48,0.25);
    transition:transform 0.1s ease, opacity 0.15s ease;
  }
  .toolbar button:hover{ opacity:0.92; transform:translateY(-1px); }
  .count{
    font-size:0.82rem;
    color:var(--muted);
    font-weight:600;
    margin-left:auto;
  }

  #grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:16px;
    padding:24px;
  }
  .qcard{
    background:#fff;
    border-radius:14px;
    padding:16px;
    text-align:center;
    box-shadow:0 4px 14px rgba(15,26,38,0.06);
    border:1px solid var(--line);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .qcard:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 26px rgba(15,26,38,0.12);
  }
  .qcard .qr{
    display:flex;
    justify-content:center;
    margin-bottom:10px;
    padding:8px;
    background:var(--paper);
    border-radius:10px;
  }
  .qcard .name{
    font-weight:700;
    font-size:0.9rem;
    font-family:'Poppins',sans-serif;
    color:var(--ink);
  }
  .qcard .code{
    display:inline-block;
    margin-top:4px;
    font-size:0.72rem;
    font-weight:600;
    letter-spacing:0.5px;
    color:var(--red-dark);
    background:#fdece7;
    padding:2px 10px;
    border-radius:999px;
  }
  .state{ padding:60px 20px; text-align:center; color:var(--muted); }
  @media print{
    .logo-bar,header,.toolbar{ display:none; }
    body{ background:#fff; }
    #grid{ padding:0; }
    .qcard{ break-inside:avoid; box-shadow:none; border:1px solid #ddd; }
  }
</style>
</head>
<body>

<div class="logo-bar">
  <img src="logo-sangam.jpeg" alt="Sangam Electronics Co.">
  <div class="divider"></div>
  <img src="logo-sunpower.jpeg" alt="Sun Power">
</div>

<header>
  <h1>Employee QR Code Generator</h1>
  <p>Pulls live from the company sheet — add or edit an employee there and refresh this page.</p>
</header>

<div class="toolbar">
  <input id="search" type="text" placeholder="Search name or emp code…">
  <button onclick="window.print()">Print all</button>
  <span class="count" id="count"></span>
</div>

<div id="grid"><div class="state">Loading employees…</div></div>

<script>
let allRows = [];
const cols = CONFIG.COLUMNS;

// The base URL this site is hosted at, e.g. https://yourname.github.io/idcard-site/
// Auto-detected from the current page location, so it works as soon as you
// deploy to GitHub Pages — no manual editing needed.
const BASE_URL = window.location.href.replace(/index\.html.*$/, '').replace(/\/$/, '') + '/';

async function load(){
  const grid = document.getElementById('grid');
  let csvText;
  try{
    const res = await fetch(CONFIG.SHEET_CSV_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('bad status');
    csvText = await res.text();
  }catch(e){
    grid.innerHTML = '<div class="state">Could not load the sheet. Check CONFIG.SHEET_CSV_URL in config.js.</div>';
    return;
  }
  const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
  allRows = parsed.data.filter(r => (r[cols.empCode] || '').trim());
  render(allRows);
}

function render(rows){
  const grid = document.getElementById('grid');
  document.getElementById('count').textContent = rows.length + ' employees';
  if (!rows.length){
    grid.innerHTML = '<div class="state">No employees found.</div>';
    return;
  }
  grid.innerHTML = '';
  rows.forEach(r => {
    const empCode = r[cols.empCode].trim();
    const name = r[cols.name] || '';
    const url = BASE_URL + 'employee.html?id=' + encodeURIComponent(empCode);

    const card = document.createElement('div');
    card.className = 'qcard';
    card.innerHTML = `
      <div class="qr" id="qr-${empCode}"></div>
      <div class="name">${name}</div>
      <div class="code">${empCode}</div>
    `;
    grid.appendChild(card);

    new QRCode(document.getElementById('qr-' + empCode), {
      text: url,
      width: 140,
      height: 140,
      correctLevel: QRCode.CorrectLevel.M
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q){ render(allRows); return; }
  render(allRows.filter(r =>
    (r[cols.name] || '').toLowerCase().includes(q) ||
    (r[cols.empCode] || '').toLowerCase().includes(q)
  ));
});

load();
</script>
</body>
</html>
