<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee ID Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="config.js"></script>
<style>
  :root{
    --navy:#0f1a26;
    --navy-2:#1c2b3d;
    --red:#e02430;
    --red-dark:#a8161f;
    --gold:#f2b705;
    --paper:#eef1f6;
    --card:#ffffff;
    --muted:#8792a1;
    --line:#eef0f4;
    --ink:#141b26;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',Arial,sans-serif;
    background:
      radial-gradient(1200px 500px at 50% -10%, #24354a 0%, var(--navy) 55%, var(--navy) 100%);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:0 16px 40px;
  }

  /* Logo bar */
  .logo-bar{
    width:100%;
    max-width:440px;
    background:rgba(255,255,255,0.97);
    backdrop-filter:blur(6px);
    border-radius:0 0 18px 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:14px 20px;
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
  }
  .logo-bar img{ height:36px; width:auto; object-fit:contain; }
  .logo-bar .divider{ width:1px; height:28px; background:#dde1e7; }

  .state{
    color:#e7ebf1;
    text-align:center;
    margin-top:100px;
    font-size:1rem;
    line-height:1.5;
    max-width:320px;
  }

  /* Card */
  .card{
    width:100%;
    max-width:440px;
    background:var(--card);
    border-radius:22px;
    box-shadow:0 24px 60px rgba(0,0,0,0.35), 0 2px 0 rgba(255,255,255,0.4) inset;
    overflow:hidden;
    margin-top:26px;
  }

  .card-header{
    position:relative;
    background:
      radial-gradient(120% 160% at 15% 0%, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0) 40%),
      linear-gradient(125deg, var(--red) 0%, var(--red-dark) 65%, #7c0f16 100%);
    color:#fff;
    padding:22px 24px 64px;
    text-align:center;
    overflow:hidden;
  }
  .card-header::after{
    content:"";
    position:absolute;
    right:-40px; top:-40px;
    width:160px; height:160px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
  }
  .card-header::before{
    content:"";
    position:absolute;
    left:-30px; bottom:-60px;
    width:130px; height:130px;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
  }
  .card-header .eyebrow{
    font-family:'Poppins',sans-serif;
    font-size:0.68rem;
    letter-spacing:3px;
    text-transform:uppercase;
    opacity:0.85;
    position:relative;
    z-index:1;
  }
  .card-header .title{
    font-family:'Poppins',sans-serif;
    font-size:1.2rem;
    font-weight:700;
    margin-top:4px;
    position:relative;
    z-index:1;
  }
  .badge-verified{
    position:relative;
    z-index:1;
    display:inline-flex;
    align-items:center;
    gap:5px;
    margin-top:10px;
    background:rgba(255,255,255,0.16);
    border:1px solid rgba(255,255,255,0.35);
    padding:4px 12px;
    border-radius:999px;
    font-size:0.68rem;
    font-weight:600;
    letter-spacing:0.5px;
  }
  .badge-verified svg{ width:12px; height:12px; }

  .photo-wrap{
    display:flex;
    justify-content:center;
    margin-top:-56px;
    position:relative;
    z-index:2;
  }
  .photo-ring{
    width:124px;
    height:124px;
    border-radius:50%;
    padding:4px;
    background:linear-gradient(135deg, var(--gold), var(--red));
    box-shadow:0 10px 24px rgba(0,0,0,0.28);
  }
  .photo-wrap img, .photo-wrap .placeholder{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #fff;
    background:#dde3ea;
    display:block;
  }
  .photo-wrap .placeholder{
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    font-size:1.9rem;
    font-weight:700;
    font-family:'Poppins',sans-serif;
  }

  .name{
    text-align:center;
    font-family:'Poppins',sans-serif;
    font-size:1.4rem;
    font-weight:700;
    color:var(--ink);
    margin:14px 0 4px;
    padding:0 20px;
  }
  .designation{
    text-align:center;
    color:var(--red);
    font-weight:600;
    font-size:0.92rem;
    margin-bottom:10px;
    padding:0 20px;
  }
  .empcode{
    display:flex;
    justify-content:center;
    margin-bottom:20px;
  }
  .empcode span{
    font-family:'Poppins',sans-serif;
    background:var(--navy);
    color:#fff;
    font-size:0.75rem;
    font-weight:600;
    letter-spacing:1px;
    padding:6px 16px;
    border-radius:999px;
  }

  .details{
    padding:4px 22px 24px;
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 4px;
    border-bottom:1px solid var(--line);
  }
  .row:last-child{ border-bottom:none; }
  .icon{
    flex:0 0 auto;
    width:34px;
    height:34px;
    border-radius:10px;
    background:linear-gradient(135deg, #fdece7, #fbdad6);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon svg{ width:17px; height:17px; stroke:var(--red-dark); }
  .row .text{ flex:1; min-width:0; }
  .label{
    color:var(--muted);
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.6px;
    margin-bottom:2px;
  }
  .value{
    font-weight:600;
    color:var(--ink);
    font-size:0.95rem;
    word-break:break-word;
  }

  .footer{
    text-align:center;
    padding:16px 20px;
    font-size:0.72rem;
    color:var(--muted);
    background:var(--paper);
    border-top:1px dashed #dde1e7;
  }
  .footer strong{ color:var(--navy-2); }
</style>
</head>
<body>

<div class="logo-bar">
  <img src="logo-sangam.jpeg" alt="Sangam Electronics Co.">
  <div class="divider"></div>
  <img src="logo-sunpower.jpeg" alt="Sun Power">
</div>

<div id="app">
  <div class="state" id="loading">Loading employee record…</div>
</div>

<script>
async function main(){
  const app = document.getElementById('app');
  const params = new URLSearchParams(window.location.search);
  const empCode = (params.get('id') || '').trim();

  if (!empCode){
    app.innerHTML = '<div class="state">No employee ID provided in the link.</div>';
    return;
  }

  let csvText;
  try{
    const res = await fetch(CONFIG.SHEET_CSV_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('Sheet fetch failed: ' + res.status);
    csvText = await res.text();
  }catch(err){
    app.innerHTML = '<div class="state">Could not load employee data.<br>Check that the sheet is published and the link in config.js is correct.</div>';
    return;
  }

  const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
  const cols = CONFIG.COLUMNS;
  const row = parsed.data.find(r => (r[cols.empCode] || '').trim().toUpperCase() === empCode.toUpperCase());

  if (!row){
    app.innerHTML = '<div class="state">No employee found for ID "' + empCode + '".</div>';
    return;
  }

  const photoUrl = driveLinkToImageUrl(row[cols.photo]);
  const initials = (row[cols.name] || '?').trim().split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase();

  const photoHtml = photoUrl
    ? `<img src="${photoUrl}" alt="Photo" onerror="this.parentNode.innerHTML='<div class=\\'placeholder\\'>${initials}</div>'">`
    : `<div class="placeholder">${initials}</div>`;

  // Icon set (inline SVG, stroke-based)
  const icons = {
    department: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`,
    dob: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`,
    doj: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M12 14v4M10 16h4"/></svg>`,
    bloodGroup: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2s7 8 7 13a7 7 0 0 1-14 0c0-5 7-13 7-13z"/></svg>`,
    contact: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .6 2.9a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.9.5 2.9.6a2 2 0 0 1 1.8 2.1z"/></svg>`,
    emergencyContact: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>`
  };

  const fmtRow = (key, label, value) => value ? `
    <div class="row">
      <div class="icon">${icons[key]}</div>
      <div class="text">
        <div class="label">${label}</div>
        <div class="value">${value}</div>
      </div>
    </div>` : '';

  app.innerHTML = `
    <div class="card">
      <div class="card-header">
        <div class="eyebrow">Employee Identification</div>
        <div class="title">ID Card Verification</div>
        <div class="badge-verified">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
          VERIFIED RECORD
        </div>
      </div>
      <div class="photo-wrap"><div class="photo-ring">${photoHtml}</div></div>
      <div class="name">${row[cols.name] || ''}</div>
      <div class="designation">${row[cols.designation] || ''}</div>
      <div class="empcode"><span>EMP CODE · ${row[cols.empCode] || ''}</span></div>
      <div class="details">
        ${fmtRow('department', 'Department', row[cols.department])}
        ${fmtRow('dob', 'Date of Birth', row[cols.dob])}
        ${fmtRow('doj', 'Date of Joining', row[cols.doj])}
        ${fmtRow('bloodGroup', 'Blood Group', row[cols.bloodGroup])}
        ${fmtRow('contact', 'Contact Number', row[cols.contact])}
        ${fmtRow('emergencyContact', 'Emergency Contact', row[cols.emergencyContact])}
      </div>
      <div class="footer"><strong>Sangam Electronics Co.</strong> — details are pulled live from company records.</div>
    </div>
  `;
}
main();
</script>
</body>
</html>
